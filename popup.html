<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeDown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 280px;
            background: #1e1e1e;
            color: #e0e0e0;
        }
        
        .container {
            padding: 16px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #444;
        }
        
        .logo {
            width: 32px;
            height: 32px;
            color: #02bc7d;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #02bc7d;
        }
        
        .version {
            font-size: 11px;
            color: #888;
            margin-left: auto;
        }
        
        .status {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        
        .status-label {
            color: #888;
        }
        
        .status-value {
            color: #e0e0e0;
            font-weight: 500;
        }
        
        .status-value.active {
            color: #02bc7d;
        }
        
        .status-value.inactive {
            color: #888;
        }
        
        .btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #02bc7d;
            color: white;
        }
        
        .btn-primary:hover {
            background: #029a66;
        }
        
        .btn-primary:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        
        .shortcut-hint {
            margin-top: 12px;
            text-align: center;
            font-size: 11px;
            color: #666;
        }
        
        .shortcut-hint kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
        
        .footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #444;
            text-align: center;
        }
        
        .footer a {
            color: #02bc7d;
            text-decoration: none;
            font-size: 12px;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #3a2020;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
        }
        
        .error-message.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span class="title">CodeDown</span>
            <span class="version">v1.5.0</span>
        </div>
        
        <div id="error-message" class="error-message"></div>
        
        <div class="status">
            <div class="status-row">
                <span class="status-label">Current site:</span>
                <span id="site-status" class="status-value inactive">Not supported</span>
            </div>
        </div>
        
        <button id="open-manager-btn" class="btn btn-primary" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span id="btn-text">Open Manager</span>
        </button>
        
        <div class="shortcut-hint">
            Shortcut: <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd>
        </div>
        
        <div class="footer">
            <a href="https://github.com/sharmanhall" target="_blank">Created by sharmanhall</a>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
